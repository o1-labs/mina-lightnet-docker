name: Build and publish Mina lightweight network Docker images (pre-release)

# Manual-dispatch only. Builds the devnet (full-proof) and lightnet (no-proof)
# images from a Mina pre-release (alpha or beta component of the unstable apt
# repo) and pushes them to Docker Hub as:
#   o1labs/mina-local-network:<mina_version>-devnet   + next-devnet
#   o1labs/mina-local-network:<mina_version>-lightnet + next-lightnet
#
# `next-<profile>` is the floating alias of the newest pre-release, for example
# the first builds of a post-hardfork Mina version. Use it to test against what
# comes after the current stable release. Stable releases use build-release.yml.
#
# Like stable, pre-release debs are the network-free `mina-devnet-generic`
# packages (Mina >= 4.0.2); the lightnet image selects its profile at runtime.
on:
  workflow_dispatch:
    inputs:
      mina_release:
        description: "Pre-release channel = component of the unstable apt repo"
        type: choice
        required: true
        default: "beta"
        options:
          - alpha
          - beta
      mina_version:
        description: "Mina pre-release version, used as Docker tag prefix (e.g. 4.1.0-beta1)"
        required: true
      mina_deb_version:
        description: "Exact deb version to install from the unstable repo (e.g. 4.1.0-beta1-abc1234). Empty = newest in the component"
        required: false
        default: ""
      archs:
        description: "Target architectures (comma-separated)"
        required: true
        default: "amd64"
      archive_api_version:
        description: "@o1-labs/mina-archive-node-graphql npm version"
        required: true
        default: "2.0.0"
      accounts_manager_version:
        description: "Mina Accounts Manager version"
        required: true
        default: "0.1.2"
      also_tag_next:
        description: "Also push next-devnet / next-lightnet (newest pre-release)"
        type: boolean
        required: true
        default: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for non-native archs)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Compute tags
        id: tags
        run: |
          devnet="${{ inputs.mina_version }}-devnet"
          lightnet="${{ inputs.mina_version }}-lightnet"
          if [[ "${{ inputs.also_tag_next }}" == "true" ]]; then
            devnet="${devnet},next-devnet"
            lightnet="${lightnet},next-lightnet"
          fi
          echo "devnet=${devnet}" >> "$GITHUB_OUTPUT"
          echo "lightnet=${lightnet}" >> "$GITHUB_OUTPUT"

      - name: Build and push devnet (full proofs)
        run: |
          ./scripts/build-image.sh \
            --archs "${{ inputs.archs }}" \
            --mina-release "${{ inputs.mina_release }}" \
            --mina-deb-version "${{ inputs.mina_deb_version }}" \
            --mina-profile devnet \
            --proof-level full \
            --archive-api-version "${{ inputs.archive_api_version }}" \
            --accounts-manager-version "${{ inputs.accounts_manager_version }}" \
            --docker-user o1labs \
            --tag "${{ steps.tags.outputs.devnet }}"

      - name: Build and push lightnet (no proofs)
        run: |
          ./scripts/build-image.sh \
            --archs "${{ inputs.archs }}" \
            --mina-release "${{ inputs.mina_release }}" \
            --mina-deb-version "${{ inputs.mina_deb_version }}" \
            --mina-profile devnet \
            --mina-runtime-profile lightnet \
            --proof-level none \
            --archive-api-version "${{ inputs.archive_api_version }}" \
            --accounts-manager-version "${{ inputs.accounts_manager_version }}" \
            --docker-user o1labs \
            --tag "${{ steps.tags.outputs.lightnet }}"
