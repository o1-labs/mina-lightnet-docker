name: Build and Test
on:
  pull_request:
    branches: [develop]
  workflow_dispatch: {}

# Builds both images from the newest stable Mina release (the same path the
# release workflows use) and runs the integration tests against them.
jobs:
  build-and-test-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image-tag: 4.0.4-lightnet
            runtime-profile: lightnet
            proof-level: none
          - image-tag: 4.0.4-devnet
            runtime-profile: ""
            proof-level: full
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image locally (${{ matrix.image-tag }})
        run: |
          runtime_profile_arg=""
          if [[ -n "${{ matrix.runtime-profile }}" ]]; then
            runtime_profile_arg="--mina-runtime-profile ${{ matrix.runtime-profile }}"
          fi
          ./scripts/build-image.sh \
            --archs amd64 \
            --mina-release stable \
            --mina-deb-version 4.0.4-c9e2eac \
            --mina-profile devnet \
            ${runtime_profile_arg} \
            --proof-level ${{ matrix.proof-level }} \
            --archive-api-version 2.0.0 \
            --accounts-manager-version 0.1.2 \
            --docker-user test-local \
            --tag ${{ matrix.image-tag }} \
            --skip-push
      - name: Run integration tests (${{ matrix.image-tag }}, proof-level=${{ matrix.proof-level }})
        run: ./scripts/test-image.sh test-local/mina-local-network:${{ matrix.image-tag }} ${{ matrix.proof-level }}
